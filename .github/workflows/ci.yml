name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: API (reglas, tiempo real y endpoints)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  sqlserver:
    name: API contra SQL Server 2022 real
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Prueba#Segura2026"
        ports:
          - 1433:1433
    env:
      DB_SERVER: localhost
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "Prueba#Segura2026"
      DB_DATABASE: autopuja_test
      DB_ENCRYPT: "true"
      DB_TRUST_SERVER_CERTIFICATE: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:sqlserver

  frontend:
    name: Compilación del frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
